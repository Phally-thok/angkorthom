<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រព័ន្ធ - ការិយាល័យអប់រំ យុវជន និងកីឡា ស្រុកអង្គរធំ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
        }
        .login-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-gold), var(--primary-light));
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
            box-shadow: var(--shadow-glow);
        }
        .login-card h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 6px;
        }
        .login-card p {
            font-size: 13px;
            color: var(--accent-gold);
            margin-bottom: 28px;
        }
        .demo-accounts {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
            text-align: left;
        }
        .demo-accounts ul {
            list-style: none;
            margin-top: 6px;
        }
        .demo-accounts li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">
        <i class="fa-solid fa-graduation-cap"></i>
    </div>
    <h2>ប្រព័ន្ធគ្រប់គ្រងការិយាល័យអប់រំ យុវជន និងកីឡា</h2>
    <p>ស្រុកអង្គរធំ • ខេត្តសៀមរាប</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    <i class="fa-solid fa-circle-exclamation"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group" style="text-align: left;">
            <label><i class="fa-solid fa-user"></i> ឈ្មោះគណនី (Username)</label>
            <input type="text" name="username" class="form-control" placeholder="បញ្ចូលឈ្មោះគណនី..." required>
        </div>

        <div class="form-group" style="text-align: left;">
            <label><i class="fa-solid fa-lock"></i> ពាក្យសម្ងាត់ (Password)</label>
            <input type="password" name="password" class="form-control" placeholder="បញ្ចូលពាក្យសម្ងាត់..." required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 10px; font-size: 14px;">
            <i class="fa-solid fa-right-to-bracket"></i> ចូលប្រើប្រាស់ប្រព័ន្ធ
        </button>
    </form>
</div>

</body>
</html>
